services:
  web:
    build: ./web
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - DATABASE_URL=postgresql://perplexity:perplexity@db:5432/perplexity
      - SEARXNG_URL=http://searxng:8080
      - BROWSER_URL=http://browser:8001
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
      browser:
        condition: service_started
    volumes:
      - ./api:/app

  browser:
    build: ./browser
    ports:
      - "8001:8001"
    shm_size: "1gb"

  searxng:
    image: searxng/searxng:latest
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=perplexity-clone-searxng
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8080:8080"

  db:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=perplexity
      - POSTGRES_PASSWORD=perplexity
      - POSTGRES_DB=perplexity
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perplexity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
